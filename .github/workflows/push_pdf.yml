name: build-pdf

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v2
        with:
          root_file: axelm_resume.tex
          compiler: pdflatex
          args: ''
          extra_packages: fontawesome, background
